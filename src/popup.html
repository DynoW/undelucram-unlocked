<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undelucram Unlocked</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --border: #e2e8f0;
        --field: #f8fafc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --accent: #38bdf8;
          --border: #1e293b;
          --field: #1e293b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 300px;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .wrap {
        padding: 14px 16px 16px;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1 img {
        width: 20px;
        height: 20px;
        border-radius: 5px;
      }
      .switch {
        position: relative;
        width: 44px;
        height: 24px;
        flex: 0 0 auto;
      }
      .switch input {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        cursor: pointer;
      }
      .slider {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--field);
        border: 1px solid var(--border);
        transition: background 0.15s ease;
        pointer-events: none;
      }
      .slider::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--muted);
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .switch input:checked + .slider {
        background: var(--accent);
        border-color: var(--accent);
      }
      .switch input:checked + .slider::after {
        transform: translateX(20px);
        background: #fff;
      }
      .switch input:focus-visible + .slider {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        flex: 0 0 auto;
      }
      .status.on .dot {
        background: #22c55e;
      }
      footer {
        margin-top: 12px;
        font-size: 12px;
      }
      footer a {
        color: var(--accent);
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="head">
        <h1><img src="../icons/32.png" alt="" /> Undelucram Unlocked</h1>
        <label class="switch">
          <input id="toggle" type="checkbox" role="switch" aria-label="Enable Undelucram Unlocked" />
          <span class="slider"></span>
        </label>
      </header>

      <div id="status" class="status">
        <span class="dot"></span>
        <span id="statusText">Checking…</span>
      </div>

      <footer>
        <a id="report" href="#" target="_blank" rel="noopener">Report a broken page</a>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
