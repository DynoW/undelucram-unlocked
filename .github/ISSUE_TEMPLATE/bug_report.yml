name: Bug report
description: Report a page that is still blurred or otherwise broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the details below — without them the issue usually can't be reproduced.
  - type: input
    id: page-url
    attributes:
      label: Page URL on undelucram.ro
      description: The exact page that is still gated or broken.
      placeholder: https://www.undelucram.ro/...
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What is still blurred or broken?
      description: What do you see, and what did you expect to see instead?
    validations:
      required: true
  - type: dropdown
    id: toggle
    attributes:
      label: Is the extension toggle enabled?
      description: Check the popup of the extension.
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Firefox 141, Chrome 139
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: See `about:addons` (Firefox) or `chrome://extensions` (Chrome).
      placeholder: e.g. 0.1.1
    validations:
      required: true
  - type: textarea
    id: console-errors
    attributes:
      label: Console or network errors
      description: Optional — open DevTools (F12) on the page and check the Console and Network tabs for errors.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional — you can drag images here.
