name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether manifest version changed
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          current=$(node -p "require('./manifest.json').version")
          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No previous commit to compare; skipping release."
            exit 0
          fi
          previous=$(git show "$BEFORE:manifest.json" 2>/dev/null \
            | node -p '(s=>{try{return JSON.parse(s).version}catch(e){return ""}})(require("fs").readFileSync(0,"utf8"))')
          if [ -n "$previous" ] && [ "$previous" != "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $previous -> $current"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($current); skipping release."
          fi

  release:
    needs: version
    if: needs.version.outputs.changed == 'true'
    outputs:
      deployed: ${{ steps.bump.outputs.deployed }}
    runs-on: ubuntu-latest
    env:
      ADDON_ID: undelucram-unlocked@dynow.github.io
      ZIP_ASSET: undelucram-unlocked.zip
      XPI_ASSET: undelucram-unlocked.xpi
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage extension files
        run: |
          mkdir -p stage
          cp -r manifest.json rules src icons stage/

      - name: Build Chrome zip
        run: |
          cp -r stage stage-chrome
          jq 'del(.browser_specific_settings)' stage/manifest.json > stage-chrome/manifest.json
          (cd stage-chrome && zip -r "../$ZIP_ASSET" .)

      - name: Sign Firefox add-on (AMO unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@latest sign \
            --source-dir stage \
            --channel unlisted \
            --artifacts-dir artifacts
          cp "$(find artifacts -name '*.xpi' | head -n1)" "$XPI_ASSET"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for f in "$ZIP_ASSET" "$XPI_ASSET"; do
            [ -f "$f" ] || { echo "::error::Missing build artifact: $f"; exit 1; }
          done
          body=$(cat <<'EOF'
          ## Install
          - **Firefox:** download `undelucram-unlocked.xpi`, then drag it into Firefox and confirm the install. Auto-updates via `updates.json`.
          - **Chrome / Edge / Brave:** download `undelucram-unlocked.zip` and unzip it to a **permanent location**. Then open `chrome://extensions` → Developer mode  → **Load unpacked**.
          - Found a broken page? [Open an issue](https://github.com/DynoW/undelucram-unlocked/issues).
          EOF
          )
          gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="v$VERSION" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Undelucram Unlocked $VERSION" \
            -F generate_release_notes=true \
            -f body="$body" \
            --jq .html_url
          gh release upload "v$VERSION" "$ZIP_ASSET" "$XPI_ASSET"

      - name: Update updates.json on main
        id: bump
        run: |
          git checkout -B main origin/main
          node scripts/bump-updates.mjs "${{ needs.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json
          if git diff --staged --quiet; then
            echo "updates.json already up to date"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update updates.json for v${{ needs.version.outputs.version }}"
            git push origin main
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    needs: release
    if: needs.release.outputs.deployed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/heads/main

      - name: Stage site
        run: mkdir -p _pages && cp updates.json _pages/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
