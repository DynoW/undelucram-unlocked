name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether manifest version changed
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          current=$(node -p "require('./manifest.json').version")
          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No previous commit to compare; skipping release."
            exit 0
          fi
          previous=$(git show "$BEFORE:manifest.json" 2>/dev/null \
            | node -p '(s=>{try{return JSON.parse(s).version}catch(e){return ""}})(require("fs").readFileSync(0,"utf8"))')
          if [ -n "$previous" ] && [ "$previous" != "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $previous -> $current"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($current); skipping release."
          fi

  release:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      ADDON_ID: undelucram-unlocked@dynow.github.io
      XPI: undelucram-unlocked.xpi
      ZIP: undelucram-unlocked.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage extension files
        run: |
          mkdir -p stage
          cp -r manifest.json rules src icons stage/

      - name: Build Chrome zip
        run: (cd stage && zip -r "../$ZIP" .)

      - name: Sign Firefox add-on (AMO unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@latest sign \
            --source-dir stage \
            --channel unlisted \
            --artifacts-dir artifacts
          cp "$(find artifacts -name '*.xpi' | head -n1)" "$XPI"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            "$ZIP" "$XPI" \
            --target "$GITHUB_SHA" \
            --title "Undelucram Unlocked ${{ needs.version.outputs.version }}" \
            --generate-notes

      - name: Update updates.json on main
        run: |
          git checkout -B main origin/main
          node scripts/bump-updates.mjs "${{ needs.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json
          if git diff --staged --quiet; then
            echo "updates.json already up to date"
          else
            git commit -m "chore: update updates.json for v${{ needs.version.outputs.version }}"
            git push origin main
          fi
